<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sobre Mi - LOSERS.COM</title>
  <link rel="stylesheet" href="SobreMi.css">
</head>

<body>

  <!-- Barra superior -->
  <header class="top-bar">
    <img src="LOGO PRINCIPAl.png" alt="Logo Losers" class="logo">
    <a href="index.html" class="btn-menu">Menu</a>
  </header>

  <!-- Contenido principal -->
  <main class="contenido">

    <!-- Sección del perfil -->
    <section class="perfil-section">
      <div class="perfil-container">
        <div class="perfil-imagen">
          <img src="perfil.jpg" alt="Asdey">
        </div>
        <div class="perfil-info">
          <h1>ASDEY</h1>
          <p class="subtitulo">Nicolas Aguiar</p>
          <p class="descripcion">
            Tu Bro, Tu pana GymRat, Fanático del Black Metal y el pop punk (si es que eso tiene algun tipo de sentido), Intento de PowerLifter y PseudoCritico.
          </p>
        </div>
      </div>
    </section>

    <!-- Sección de redes sociales -->
    <section class="redes-section">
      <h2>Conecta Conmigo</h2>
      <div class="redes-grid">
        <a href="#" class="red-card instagram">
          <img src="Icono IG.webp" alt="Instagram">
          <span>Instagram</span>
        </a>
        <a href="#" class="red-card youtube">
          <img src="Logo YT.png" alt="YouTube">
          <span>YouTube</span>
        </a>
        <a href="#" class="red-card tiktok">
          <img src="LogoTT.png" alt="TikTok">
          <span>TikTok</span>
        </a>
      </div>
    </section>

  </main>

</body>
</html>
